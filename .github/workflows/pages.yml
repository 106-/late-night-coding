# Publish the page to GitHub Pages on every push to main.
# Only the static site goes up (index.html, src/, assets/ and the library files the page imports
# from node_modules); serve.mjs stays in the repo. On Pages the tuning panel can't save — that
# needs `npm start` (node serve.mjs) on the PC.
#
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # index.html, src/, assets/room, rei.vrm, pose/layout json, used library files → _site/
      - name: Collect the static site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
